name: Build & Release

on:
  push:
    tags:
      - '*'          # any tag, e.g. 1.4.9 -> builds and publishes a release
  workflow_dispatch: # manual build from the Actions tab

permissions:
  contents: write    # required to create the GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gtnhgradle derives the mod version from `git describe --tags`,
          # so the full history and all tags are required
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Collect release jar
        run: |
          ls -l build/libs
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-dev.jar dist/*-sources.jar dist/*-api.jar
          ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classicbar-jar
          path: dist/*.jar

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
